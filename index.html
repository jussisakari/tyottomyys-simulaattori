<!DOCTYPE html>
<html lang="fi">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="mobile-web-app-capable" content="yes">
  <title>Työttömyys-simulaattori</title>
  <meta name="apple-mobile-web-app-title" content="Työtön">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <meta name="theme-color" content="#14121c">
  <link rel="manifest" href="manifest.webmanifest">
  <link rel="icon" type="image/png" href="icons/icon-192.png">
  <link rel="apple-touch-icon" href="icons/apple-touch-icon.png">
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <canvas id="game" width="320" height="180"></canvas>

  <div id="rotate-hint">
    <div class="rotate-icon">📱↻</div>
    <div>Käännä puhelin vaakatasoon</div>
  </div>

  <!-- The game files are loaded with the version number in their address, so phones
       never keep running an old cached version. version.txt is read without the cache.
       Bump version.txt on every release. From file:// (testing) the files load directly. -->
  <script>
    (function () {
      var files = [
        'js/engine.js', 'js/pixel.js', 'js/sprites.js', 'js/texts.js', 'js/state.js', 'js/ui.js',
        'js/events.js', 'js/calls.js', 'js/tori.js', 'js/wazzup.js',
        'js/scenes/title.js', 'js/scenes/apartment.js', 'js/scenes/fridge.js', 'js/scenes/bathroom.js',
        'js/scenes/tv.js', 'js/scenes/laptop.js', 'js/scenes/some.js', 'js/scenes/call.js',
        'js/scenes/phonehome.js', 'js/scenes/street.js', 'js/scenes/places.js', 'js/scenes/tarja.js',
        'js/scenes/ending.js', 'js/scenes/slot.js', 'js/scenes/jackpot.js', 'js/main.js'
      ];
      function load(v) {
        files.forEach(function (f) {
          var s = document.createElement('script');
          s.src = f + (v ? '?v=' + encodeURIComponent(v) : '');
          s.async = false; // keep the order
          document.body.appendChild(s);
        });
      }
      if (location.protocol === 'file:' || !window.fetch) { load(''); return; }
      fetch('version.txt', { cache: 'no-store' })
        .then(function (r) { return r.ok ? r.text() : String(Date.now()); })
        .then(function (v) { load(v.trim()); }, function () { load(String(Date.now())); });
    })();
  </script></body>
</html>
